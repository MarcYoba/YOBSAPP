security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall dédié à la route de connexion JWT
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Firewall général pour sécuriser le reste de l'API
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        # Autorise l'accès public à la connexion
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/auth/check-users, roles: PUBLIC_ACCESS }
        - { path: ^/api/register-admin, roles: PUBLIC_ACCESS }
        # Exige un token JWT valide pour toutes les autres routes /api
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }